services:
  app:
    build: .
    ports:
      - "5002:5002"
    env_file:
      - .env
    volumes:
      - /home/ronyzs/api/my-express-mysql:/usr/src/app/
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: